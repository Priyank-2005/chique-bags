<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chique Bags | Coming Soon</title>
<meta name="description" content="Chique Bags - Handcrafted embellished bags. Our new online home is coming soon.">
<meta property="og:title" content="Chique Bags | Coming Soon">
<meta property="og:description" content="We are building a new home online for our embellished bags.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
:root {
  --pink-light: #fff8fa;
  --pink-base: #fae8ee;
  --pink-deep: #f3d7e1;
  --text-main: #141414;
  --text-muted: #61555a;
  --brand-pink-dark: #b8436e;
  box-sizing: border-box;
}

*, *::before, *::after {
  box-sizing: inherit;
}

html {
  min-height: 100%;
  background-color: var(--pink-base);
}

body {
  margin: 0;
  min-height: 100vh;
  /* Seamless, ultra-soft luxury baby pink base */
  background: radial-gradient(120% 90% at 50% 12%, var(--pink-light) 0%, var(--pink-base) 55%, var(--pink-deep) 100%);
  background-color: var(--pink-base);
  background-attachment: fixed;
  background-size: cover;
  background-repeat: no-repeat;
  color: var(--text-main);
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 48px 24px;
  box-sizing: border-box;
}

main {
  width: 100%;
  max-width: 540px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Elegant brand header */
.brand {
  font-family: 'Bodoni Moda', Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 1.35rem;
  color: var(--brand-pink-dark);
  letter-spacing: .08em;
  margin: 0 0 20px;
}

/* ===================================================
   AUTHENTIC BLACK "COMING Soon" ARTWORK (Exact Match)
=================================================== */
.coming-soon-wrap {
  width: 100%;
  max-width: 440px;
  margin: 8px auto 28px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.coming-soon-img {
  width: 100%;
  max-width: 390px;
  height: auto;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
  filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.06));
}

/* Descriptive Lede */
.lede {
  font-size: 1.08rem;
  line-height: 1.65;
  max-width: 34ch;
  margin: 0 0 34px;
  color: var(--text-muted);
  font-weight: 400;
}

/* High Fashion CTA Button */
.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: #141414;
  color: #ffffff;
  font-weight: 500;
  text-decoration: none;
  padding: 14px 34px;
  border-radius: 999px;
  font-size: 0.98rem;
  letter-spacing: 0.02em;
  transition: all 0.25s ease;
  box-shadow: 0 8px 22px rgba(20, 20, 20, 0.16);
}

.cta svg {
  width: 19px;
  height: 19px;
  fill: currentColor;
}

.cta:hover {
  background: #2b2b2b;
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(20, 20, 20, 0.24);
}

.cta:focus-visible {
  outline: 3px solid #141414;
  outline-offset: 3px;
}

/* Note */
.note {
  margin: 18px 0 0;
  font-size: 0.9rem;
  color: rgba(97, 85, 90, 0.75);
}

/* Bottom Domain */
.domain-footer {
  margin-top: 48px;
  font-family: 'Bodoni Moda', Georgia, serif;
  font-size: 0.92rem;
  letter-spacing: 0.14em;
  color: rgba(97, 85, 90, 0.6);
  text-transform: lowercase;
}
</style>
</head>
<body>

<main>
  <!-- Brand Name -->
  <p class="brand">Chique Bags</p>

  <!-- Black COMING Soon Exact Artwork -->
  <div class="coming-soon-wrap">
    <img 
      src="coming_soon_black.png" 
      alt="COMING Soon" 
      class="coming-soon-img"
    >
  </div>

  <!-- Updated Text -->
  <p class="lede">We are building a new home online for our embellished bags.</p>

  <!-- Instagram Direct CTA -->
  <a class="cta" href="https://www.instagram.com/chiquebagsofficial/" target="_blank" rel="noopener">

    Follow @chiquebagsofficial
  </a>

  <p class="note">See our latest pieces and launch updates on Instagram.</p>

  <!-- Bottom Domain Reference -->
  <p class="domain-footer">www.chiquebags.com</p>
</main>

</body>
</html>
