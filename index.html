<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Chique Bags | Coming Soon</title>
<meta name="description" content="Chique Bags - Handcrafted embellished bags, potlis and everyday jewellery. Our new online home is coming soon.">
<meta property="og:title" content="Chique Bags | Coming Soon">
<meta property="og:description" content="We are building a new home online for our embellished bags, potlis and everyday jewellery.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: dark;
  --wine: #4A0E32;
  --wine-deep: #2E0620;
  --wine-darkest: #1A0313;
  --gold: #E6BC6A;
  --gold-hover: #F2D08E;
  --blush: #F7DCE0;
  --rose: #C9487A;
  box-sizing: border-box;
}

*, *::before, *::after {
  box-sizing: inherit;
}

html {
  min-height: 100%;
  background-color: var(--wine-deep);
}

body {
  margin: 0;
  min-height: 100vh;
  /* Seamless, uniform full-bleed luxury radial gradient without any line or banding */
  background: radial-gradient(ellipse at 50% 15%, var(--wine) 0%, var(--wine-deep) 60%, var(--wine-darkest) 100%);
  background-color: var(--wine-deep);
  background-attachment: fixed;
  background-size: cover;
  background-repeat: no-repeat;
  color: var(--blush);
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  box-sizing: border-box;
}

main {
  width: 100%;
  max-width: 580px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Subtle floating potli animation */
.potli-wrap {
  margin-bottom: 20px;
  animation: floatBag 4.8s ease-in-out infinite;
}

@keyframes floatBag {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-6px);
  }
}

.potli {
  width: min(200px, 48vw);
  height: auto;
  overflow: visible;
  filter: drop-shadow(0 14px 25px rgba(0, 0, 0, 0.4));
}

/* Continuous elegant glint shine animation */
.glint {
  opacity: .9;
  transform-box: fill-box;
  transform-origin: center;
}

.glint.g1 {
  animation: shine 3.6s ease-out 0.4s infinite;
}

.glint.g2 {
  animation: shine 3.6s ease-out 1.6s infinite;
}

.glint.g3 {
  animation: shine 3.6s ease-out 2.8s infinite;
}

@keyframes shine {
  0% {
    opacity: 0;
    transform: scale(0.1) rotate(0deg);
  }
  25% {
    opacity: 1;
    transform: scale(1.4) rotate(45deg);
  }
  50% {
    opacity: 0.9;
    transform: scale(1) rotate(90deg);
  }
  75%, 100% {
    opacity: 0;
    transform: scale(0.3) rotate(135deg);
  }
}

.brand {
  font-family: 'Bodoni Moda', Georgia, serif;
  font-style: italic;
  font-weight: 500;
  font-size: 1.25rem;
  color: var(--gold);
  letter-spacing: .08em;
  margin: 0 0 14px;
  text-shadow: 0 2px 10px rgba(230, 188, 106, 0.2);
}

/* ===================================================
   AUTHENTIC "COMING Soon" ARTWORK (Exact Match)
=================================================== */
.coming-soon-wrap {
  width: 100%;
  max-width: 440px;
  margin: 6px auto 26px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.coming-soon-img {
  width: 100%;
  max-width: 390px;
  height: auto;
  display: block;
  filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.45));
  user-select: none;
  -webkit-user-drag: none;
}

.lede {
  font-size: 1.05rem;
  line-height: 1.65;
  max-width: 36ch;
  margin: 0 0 30px;
  color: var(--blush);
  font-weight: 400;
}

/* Category pills */
.range {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 0 0 34px;
  padding: 0;
  list-style: none;
}

.range li {
  border: 1px solid rgba(230, 188, 106, 0.45);
  background: rgba(230, 188, 106, 0.05);
  color: var(--gold);
  border-radius: 999px;
  padding: 8px 18px;
  font-size: 0.9rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  backdrop-filter: blur(4px);
  transition: all 0.2s ease;
}

.range li:hover {
  background: rgba(230, 188, 106, 0.12);
  border-color: var(--gold);
  transform: translateY(-1px);
}

/* Main CTA Button */
.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--gold);
  color: var(--wine-deep);
  font-weight: 600;
  text-decoration: none;
  padding: 14px 32px;
  border-radius: 999px;
  font-size: 1rem;
  transition: all 0.25s ease;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
}

.cta svg {
  width: 19px;
  height: 19px;
  fill: currentColor;
}

.cta:hover {
  background: var(--gold-hover);
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(230, 188, 106, 0.35);
}

.cta:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}

.note {
  margin: 18px 0 0;
  font-size: 0.9rem;
  color: rgba(247, 220, 224, 0.75);
}

.domain-footer {
  margin-top: 36px;
  font-family: 'Bodoni Moda', Georgia, serif;
  font-size: 0.92rem;
  letter-spacing: 0.12em;
  color: rgba(247, 220, 224, 0.5);
  text-transform: lowercase;
}

@media (prefers-reduced-motion: reduce) {
  .potli-wrap { animation: none !important; }
  .glint { animation: none !important; }
}
</style>
</head>
